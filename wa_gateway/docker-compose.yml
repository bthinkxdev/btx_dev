services:
  wa-gateway:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - LOG_LEVEL=info
      - WA_SESSIONS=admin1,admin2,admin3
      - DJANGO_API_URL=http://host.docker.internal:8000
      - DJANGO_API_TOKEN=${DJANGO_API_TOKEN}
      - WHATSAPP_WEBJS_BRIDGE_TOKEN=${WHATSAPP_WEBJS_BRIDGE_TOKEN}
      - HUMAN_TAKEOVER_COOLDOWN_MINUTES=30
      - SEND_MIN_DELAY_MS=1200
      - SEND_MAX_DELAY_MS=3500
      - SEND_QUEUE_CONCURRENCY=1
      - MEDIA_MAX_BYTES=10485760
    volumes:
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./tmp_media:/app/tmp_media


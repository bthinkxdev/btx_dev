<style>
  .project-ticket-board { margin-top: 8px; }
  .ticket-kanban {
    display: grid;
    grid-template-columns: repeat(5, minmax(180px, 1fr));
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .ticket-col {
    background: var(--neutral-50);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
  }
  .ticket-col__head {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .ticket-col__body { flex: 1; padding: 8px; min-height: 100px; }
  .ticket-col__body.is-drag-over { background: var(--primary-50); outline: 2px dashed var(--primary-500); outline-offset: -4px; }
  .ticket-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .ticket-card.is-dragging { opacity: 0.45; }
  .ticket-card__link {
    display: block;
    font-weight: 600;
    color: var(--neutral-900);
    line-height: 1.35;
    text-decoration: none;
    cursor: pointer;
  }
  .ticket-card__link:hover { color: var(--primary-600); }
  .ticket-card__project { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  .ticket-card__meta {
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }
  .ticket-card__thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .ticket-card__thumbs img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .ticket-card__dropzone {
    margin-top: 8px;
    padding: 6px 8px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    transition: background .15s, border-color .15s;
  }
  .ticket-card__dropzone.is-file-over {
    border-color: var(--primary-500);
    background: var(--primary-50);
    color: var(--primary-700);
  }
  .ticket-priority--high { color: var(--danger-600); font-weight: 600; }
  .ticket-priority--medium { color: var(--warning-600); }
  .ticket-ref-thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .ticket-ref-thumb {
    width: 48px; height: 48px; padding: 0; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; cursor: zoom-in; background: #fff;
  }
  .ticket-ref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 1100px) {
    .ticket-kanban { grid-template-columns: repeat(3, minmax(200px, 1fr)); }
  }
</style>
<script>
(function () {
  function csrf() {
    const el = document.querySelector('[name=csrfmiddlewaretoken]');
    return el ? el.value : '';
  }
  function boardEl() {
    return document.getElementById('project-ticket-board');
  }
  function filterQuery() {
    const b = boardEl();
    return b && b.dataset.filterQuery ? b.dataset.filterQuery : '';
  }
  function refreshBoard(html) {
    const wrap = boardEl();
    if (wrap && html) {
      wrap.outerHTML = html;
      initTicketBoard();
    }
  }
  function reloadBoard() {
    const q = filterQuery();
    const url = '{% url "crm:tickets_board" %}' + (q ? '?' + q : '');
    fetch(url, { headers: { 'HX-Request': 'true' } })
      .then(r => r.text())
      .then(refreshBoard);
  }
  async function uploadFilesToTicket(card, files) {
    const url = card.getAttribute('data-upload-url');
    if (!url || !files.length) return;
    const isImage = Array.from(files).every(f => (f.type || '').startsWith('image/'));
    for (let i = 0; i < files.length; i++) {
      const fd = new FormData();
      fd.append('csrfmiddlewaretoken', csrf());
      fd.append('file', files[i]);
      fd.append('visibility', 'team');
      if (isImage) fd.append('is_reference', '1');
      await fetch(url, {
        method: 'POST',
        body: fd,
        headers: { 'HX-Request': 'true', 'HX-Board-Refresh': i === files.length - 1 ? 'true' : 'false' },
      });
    }
    reloadBoard();
  }
  function initTicketBoard() {
    const board = document.getElementById('ticket-kanban');
    if (!board) return;
    let dragged = null;
    board.querySelectorAll('.ticket-card').forEach(card => {
      card.addEventListener('dragstart', e => {
        if (e.target.closest('.ticket-card__dropzone')) return;
        dragged = card;
        card.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('is-dragging');
        board.querySelectorAll('.ticket-drop-target').forEach(c => c.classList.remove('is-drag-over'));
      });
      const zone = card.querySelector('.ticket-card__dropzone');
      if (zone) {
        ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.add('is-file-over');
        }));
        zone.addEventListener('dragleave', e => {
          e.stopPropagation();
          zone.classList.remove('is-file-over');
        });
        zone.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('is-file-over');
          if (e.dataTransfer.files.length) uploadFilesToTicket(card, e.dataTransfer.files);
        });
      }
    });
    board.querySelectorAll('.ticket-drop-target').forEach(col => {
      col.addEventListener('dragover', e => {
        if (e.dataTransfer.types.includes('Files')) return;
        e.preventDefault();
        col.classList.add('is-drag-over');
      });
      col.addEventListener('dragleave', () => col.classList.remove('is-drag-over'));
      col.addEventListener('drop', e => {
        if (e.dataTransfer.files.length) return;
        e.preventDefault();
        col.classList.remove('is-drag-over');
        if (!dragged) return;
        let moveUrl = dragged.getAttribute('data-move-url');
        const q = filterQuery();
        if (q && moveUrl.indexOf('?') === -1) moveUrl += '?' + q;
        const newStatus = col.dataset.status;
        col.appendChild(dragged);
        const fd = new FormData();
        fd.append('status', newStatus);
        fd.append('position', col.querySelectorAll('.ticket-card').length);
        fd.append('csrfmiddlewaretoken', csrf());
        fetch(moveUrl, { method: 'POST', body: fd, headers: { 'HX-Request': 'true' } })
          .then(r => r.text())
          .then(refreshBoard);
      });
    });
  }
  document.body.addEventListener('htmx:afterSwap', function (ev) {
    if (ev.detail.target && (ev.detail.target.id === 'project-ticket-board' || ev.detail.target.querySelector && ev.detail.target.querySelector('#project-ticket-board'))) {
      initTicketBoard();
    }
  });
  initTicketBoard();
})();
</script>

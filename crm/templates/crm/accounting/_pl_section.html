{% load crm_tags %}
<tbody class="divide-y divide-gray-100 dark:divide-gray-800">
  <tr class="bg-gray-50 dark:bg-white/3"><th class="th" colspan="3">{{ title }}</th></tr>
  {% for r in rows %}<tr><td class="td"><a class="link" href="{% url 'crm:general_ledger' %}?account={{ r.account.pk }}&start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}">{{ r.account.code }} {{ r.account.name }}</a></td><td class="td text-right">{{ r.amount|inr }}</td><td class="td text-right text-gray-500">{{ prev_map|get_item:r.account.pk|default:0|inr }}</td></tr>{% empty %}<tr><td class="td muted" colspan="3">None</td></tr>{% endfor %}
  <tr class="font-semibold"><td class="td">Total {{ title|lower }}</td><td class="td text-right">{{ total|inr }}</td><td class="td text-right text-gray-500">{{ ptotal|inr }}</td></tr>
</tbody>

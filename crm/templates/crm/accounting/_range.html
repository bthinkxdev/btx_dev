{% load crm_tags %}
<form method="get" class="card mb-6 flex flex-col gap-3 p-4 lg:flex-row lg:flex-wrap lg:items-end">
  {% if request.GET.account %}<input type="hidden" name="account" value="{{ request.GET.account }}">{% endif %}
  <div><label class="form-label" for="r-start">From</label><input id="r-start" type="date" name="start" value="{{ start|date:'Y-m-d' }}" class="form-input h-10"></div>
  <div><label class="form-label" for="r-end">To</label><input id="r-end" type="date" name="end" value="{{ end|date:'Y-m-d' }}" class="form-input h-10"></div>
  {% if dims_filter %}
    <div><label class="form-label" for="r-client">Client</label><select id="r-client" name="client" class="form-select h-10 w-48"><option value="">All</option>{% for c in clients %}<option value="{{ c.pk }}" {% if dims.client == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.display_name }}</option>{% endfor %}</select></div>
    <div><label class="form-label" for="r-project">Project</label><select id="r-project" name="project" class="form-select h-10 w-48"><option value="">All</option>{% for p in projects %}<option value="{{ p.pk }}" {% if dims.project == p.pk|stringformat:'s' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
    <div><label class="form-label" for="r-service">Service</label><select id="r-service" name="service" class="form-select h-10 w-48"><option value="">All</option>{% for s in services %}<option value="{{ s.pk }}" {% if dims.service == s.pk|stringformat:'s' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
  {% endif %}
  <button class="btn btn-secondary">Apply</button>
  <div class="flex flex-wrap gap-2 lg:ml-auto">{% for key, label in presets %}<a href="?preset={{ key }}{% if request.GET.account %}&account={{ request.GET.account }}{% endif %}" class="chip {% if preset == key %}chip-active{% else %}chip-inactive{% endif %}">{{ label }}</a>{% endfor %}</div>
</form>

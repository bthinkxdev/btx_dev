{% load crm_tags %}
<tr class="align-top" data-row>
  <td class="px-2 py-2 min-w-64"><select name="{{ lf.account.html_name }}" class="form-select h-10" aria-label="Account"><option value="">Choose account</option>{% for a in accounts %}<option value="{{ a.id }}" {% if lf.account.value|stringformat:'s' == a.id|stringformat:'s' %}selected{% endif %}>{{ a.label }}</option>{% endfor %}</select>
    {% for e in lf.non_field_errors %}<p class="form-error">{{ e }}</p>{% endfor %}{% for f in lf %}{% for e in f.errors %}<p class="form-error">{{ f.label }}: {{ e }}</p>{% endfor %}{% endfor %}</td>
  <td class="px-2 py-2 w-36"><input type="number" step="0.01" min="0" name="{{ lf.debit.html_name }}" value="{{ lf.debit.value|default_if_none:'' }}" class="form-input h-10 text-right" data-dr aria-label="Debit"></td>
  <td class="px-2 py-2 w-36"><input type="number" step="0.01" min="0" name="{{ lf.credit.html_name }}" value="{{ lf.credit.value|default_if_none:'' }}" class="form-input h-10 text-right" data-cr aria-label="Credit"></td>
  <td class="px-2 py-2 min-w-48"><input name="{{ lf.description.html_name }}" value="{{ lf.description.value|default_if_none:'' }}" maxlength="300" class="form-input h-10" aria-label="Line note"></td>
  <td class="px-2 py-2 w-44">{{ lf.client }}</td>
  <td class="px-2 py-2 w-44">{{ lf.project }}</td>
  <td class="px-2 py-2"><button type="button" class="btn-icon-sm" data-remove aria-label="Remove line">{% icon 'trash' 16 %}</button></td>
</tr>

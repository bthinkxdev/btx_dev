<form method="get" class="filter-bar" style="margin-bottom:20px;"
      action="{% url action_url_name %}"
      hx-get="{% url action_url_name %}"
      hx-target="#crm-main-content"
      hx-select="#crm-main-content"
      hx-swap="outerHTML"
      hx-push-url="true">
  <div>
    <label for="rep-period">Period</label>
    <select id="rep-period" name="period" onchange="var c=document.getElementById('rep-custom');if(c){c.style.display=this.value==='custom'?'flex':'none';}">
      <option value="today" {% if period == 'today' %}selected{% endif %}>Today</option>
      <option value="week" {% if period == 'week' %}selected{% endif %}>This Week</option>
      <option value="month" {% if period == 'month' %}selected{% endif %}>This Month</option>
      <option value="custom" {% if period == 'custom' %}selected{% endif %}>Custom Date</option>
    </select>
  </div>
  <div id="rep-custom" style="display:{% if period == 'custom' %}flex{% else %}none{% endif %};gap:12px;flex-wrap:wrap;align-items:flex-end;">
    <div>
      <label for="rep-from">From</label>
      <input id="rep-from" type="date" name="date_from" value="{{ date_from }}">
    </div>
    <div>
      <label for="rep-to">To</label>
      <input id="rep-to" type="date" name="date_to" value="{{ date_to }}">
    </div>
  </div>
  <div>
    <label>&nbsp;</label>
    <button type="submit" class="btn btn-primary btn-sm">Apply</button>
  </div>
</form>

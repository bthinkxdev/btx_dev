{% if value %}
<code style="display:block;word-break:break-all;font-size:12px;padding:8px;background:var(--neutral-100);border-radius:8px;border:1px solid var(--border);">{{ value }}</code>
{% else %}
<span style="font-size:12px;color:var(--text-muted);">No value or not permitted.</span>
{% endif %}

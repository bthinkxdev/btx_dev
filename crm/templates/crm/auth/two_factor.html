{% extends "crm/auth/auth_base.html" %}{% load crm_tags %}
{% block title %}Two-factor check{% endblock %}
{% block form %}
<div class="mb-5 sm:mb-8">
  <h1 class="text-title-sm mb-2 font-semibold text-gray-800 dark:text-white/90">Two-factor check</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400">Enter the 6-digit code from your authenticator app.</p>
</div>
{% if error %}<div class="alert alert-error mb-5" role="alert"><p class="text-sm">{{ error }}</p></div>{% endif %}
<form method="post">{% csrf_token %}
  <label for="id_code" class="form-label">Code <span class="text-error-500">*</span></label>
  <input id="id_code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required class="form-input mb-5 tracking-widest" autofocus>
  <button class="btn btn-primary w-full" data-loading-text="Checking…">Verify and continue</button>
</form>
<form method="post" action="{% url 'crm:logout' %}" class="mt-4">{% csrf_token %}<button class="btn-link text-sm">Cancel and sign out</button></form>
{% endblock %}

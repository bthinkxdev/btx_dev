{% extends "crm/auth/auth_base.html" %}{% load crm_tags %}
{% block form %}
<div class="mb-5 sm:mb-8">
  <h1 class="text-title-sm sm:text-title-md mb-2 font-semibold text-gray-800 dark:text-white/90">Sign in</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400">Enter your email or username and password.</p>
</div>
{% if error %}
  <div class="alert alert-error mb-5" role="alert"><span class="text-error-500">{% icon 'alert' 20 %}</span><p class="text-sm text-gray-700 dark:text-gray-300">{{ error }}</p></div>
{% endif %}
<form method="post" novalidate>{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="space-y-5">
    <div>
      <label for="id_username" class="form-label">Email or username <span class="text-error-500">*</span></label>
      <input id="id_username" name="username" type="text" autocomplete="username" required value="{{ username }}" class="form-input" autofocus>
    </div>
    <div>
      <label for="id_password" class="form-label">Password <span class="text-error-500">*</span></label>
      <div x-data="{ show: false }" class="relative">
        <input id="id_password" name="password" :type="show ? 'text' : 'password'" type="password" autocomplete="current-password" required class="form-input pr-11">
        <button type="button" @click="show = !show" class="absolute top-1/2 right-4 -translate-y-1/2 text-gray-500" :aria-label="show ? 'Hide password' : 'Show password'">{% icon 'eye' 20 %}</button>
      </div>
    </div>
    <button class="btn btn-primary w-full" data-loading-text="Signing in…">Sign in</button>
  </div>
</form>
<p class="mt-6 text-sm text-gray-500 dark:text-gray-400">Forgot your password? Ask an administrator to reset your access.</p>
{% endblock %}

{% load static crm_tags %}<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Sign in{% endblock %} | BThinkX Business OS</title>
  <link rel="icon" href="{% static 'crm/images/icon-192.png' %}">
  <script>try{if(JSON.parse(localStorage.getItem('darkMode')))document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="{% static 'crm/css/crm.css' %}">
</head>
<body class="bg-white dark:bg-gray-900">
  <div class="relative z-1 bg-white p-6 sm:p-0 dark:bg-gray-900">
    <div class="relative flex min-h-screen w-full flex-col justify-center sm:p-0 lg:flex-row dark:bg-gray-900">
      <div class="flex w-full flex-1 flex-col lg:w-1/2">
        <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
          {% include "crm/partials/toasts.html" %}
          {% block form %}{% endblock %}
        </div>
      </div>
      <div class="bg-brand-950 relative hidden h-full min-h-screen w-full items-center lg:grid lg:w-1/2 dark:bg-white/5">
        <div class="z-1 flex items-center justify-center">
          <div class="absolute top-0 right-0 -z-1 w-full max-w-[250px] xl:max-w-[450px]"><img src="{% static 'crm/images/grid-01.svg' %}" alt=""></div>
          <div class="absolute bottom-0 left-0 -z-1 w-full max-w-[250px] rotate-180 xl:max-w-[450px]"><img src="{% static 'crm/images/grid-01.svg' %}" alt=""></div>
          <div class="flex max-w-xs flex-col items-center">
            <img src="{% static 'crm/images/logo.jpg' %}" alt="BThinkX" class="mb-4 h-24 w-20 rounded-xl object-cover object-top">
            <p class="text-xl font-semibold text-white">BThinkX Business OS</p>
            <p class="mt-2 text-center text-gray-400 dark:text-white/60">From first enquiry to cash in the bank. No lead lost, no rupee unexplained.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'crm/js/ui.js' %}"></script>
  <script defer src="{% static 'crm/vendor/alpine.min.js' %}"></script>
</body>
</html>

<style>
  .wb-page { width: 100%; max-width: none; }
  .wb-exec-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .wb-exec-picker__label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .wb-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .wb-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    display: block;
    border-left: 3px solid var(--neutral-300);
  }
  .wb-stat.is-active { outline: 2px solid var(--primary-500); outline-offset: -1px; }
  .wb-stat--danger { border-left-color: var(--danger-500); }
  .wb-stat--info { border-left-color: var(--primary-500); }
  .wb-stat--success { border-left-color: var(--success-500); }
  .wb-stat--warn { border-left-color: var(--warning-500); }
  .wb-stat--muted { border-left-color: var(--neutral-300); }
  .wb-stat__value { display: block; font-size: 22px; font-weight: 800; color: var(--neutral-900); }
  .wb-stat__label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }

  .wb-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .wb-tab {
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--neutral-100);
    text-decoration: none;
  }
  .wb-tab.is-active { background: var(--primary-500); color: #fff; }

  .wb-row__name { font-weight: 700; color: var(--neutral-900); text-decoration: none; }
  .wb-empty { text-align: center; padding: 40px 0; color: var(--text-muted); }

  /* ── Stat cards: icon circle on the right ──────────────────── */
  .wb-stat { position: relative; padding-right: 54px; }
  .wb-stat__icon {
    position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .wb-stat__icon--danger  { background: var(--danger-50);  color: var(--danger-500); }
  .wb-stat__icon--info    { background: var(--primary-50); color: var(--primary-500); }
  .wb-stat__icon--success { background: var(--success-50); color: var(--success-500); }
  .wb-stat__icon--muted   { background: var(--neutral-100); color: var(--neutral-500); }
  .wb-stat__icon--warn    { background: var(--warning-50); color: var(--warning-500); }

  /* ── Workbench table ────────────────────────────────────── */
  .wb-wrap {
    width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); box-shadow: var(--shadow-sm);
  }
  .wb-table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13px; }
  .wb-table thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);
    background: var(--neutral-50); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .wb-th-check { width: 36px; text-align: center !important; }
  .wb-th-actions { width: 260px; }
  .wb-table tbody tr { border-bottom: 1px solid var(--neutral-100); }
  .wb-table tbody tr:last-child { border-bottom: none; }
  .wb-table tbody tr:hover { background: var(--neutral-50); }
  .wb-table td { padding: 10px 12px; vertical-align: middle; }
  .wb-cell-lead { min-width: 190px; }
  .wb-lead-name-line { display: flex; align-items: center; gap: 8px; }
  .wb-lead-phone {
    display: flex; align-items: center; gap: 5px; margin-top: 3px;
    font-size: 12px; color: var(--text-muted);
  }
  .wb-cell-package, .wb-cell-value { color: var(--neutral-700); white-space: nowrap; }
  .wb-cell-value { font-weight: 700; color: var(--neutral-800); }
  .wb-cell-next { white-space: nowrap; }

  .wb-task-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: var(--danger-50); color: var(--danger-600);
  }
  .wb-task-badge--danger { background: var(--danger-50); color: var(--danger-600); }
  .wb-task-due {
    display: flex; align-items: center; gap: 5px; margin-top: 4px;
    font-size: 11px; font-weight: 600; color: var(--text-muted);
  }
  .wb-task-due--danger { color: var(--danger-600); font-weight: 700; }

  .wb-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wb-act-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--neutral-700);
    font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none !important;
  }
  .wb-act-btn:hover { background: var(--neutral-50); border-color: var(--primary-300); }
  .wb-act-btn--primary {
    background: var(--primary-600); border-color: var(--primary-600); color: #fff;
  }
  .wb-act-btn--primary:hover { background: var(--primary-700); }

  /* Sortable column headers (shared visual language with the Leads table) */
  .lt-sort-link { display: inline-flex; align-items: center; gap: 5px; color: inherit; text-decoration: none !important; cursor: pointer; }
  .lt-sort-link:hover { color: var(--primary-600); }
  .lt-sort-ico { display: inline-flex; flex-direction: column; gap: 1px; }
  .lt-sort-ico svg { display: block; opacity: 0.3; }
  .lt-sort--asc .lt-sort-ico svg:first-child { opacity: 1; color: var(--primary-600); }
  .lt-sort--desc .lt-sort-ico svg:last-child { opacity: 1; color: var(--primary-600); }

  /* Pagination (shared visual language with the Leads table) */
  .lt-pagination { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 2px 2px 0; }
  .lt-pagination__count { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  .lt-pagination__pages { display: flex; align-items: center; gap: 4px; }
  .lt-page-btn {
    min-width: 30px; height: 30px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    color: var(--neutral-700); font-size: 12.5px; font-weight: 700; text-decoration: none !important;
  }
  .lt-page-btn:hover { background: var(--neutral-50); }
  .lt-page-btn.is-active { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }
  .lt-page-btn.is-disabled { opacity: 0.4; pointer-events: none; }
  .lt-page-ellipsis { padding: 0 4px; color: var(--text-muted); font-weight: 700; }

  /* Colored status pill-select (shared visual language with the Leads table) */
  .lt-status-select {
    padding: 5px 8px; font-size: 12px !important; font-weight: 700;
    border-radius: 6px; border: 1px solid var(--border); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis;
  }
  .lt-status-select:focus { outline: none; box-shadow: 0 0 0 2px rgba(99,102,241,.18); }
  .lt-status-select--new         { background: var(--neutral-100); color: var(--neutral-600); border-color: var(--neutral-200); }
  .lt-status-select--contacted   { background: var(--primary-50);  color: var(--primary-700); border-color: var(--primary-200); }
  .lt-status-select--qualified   { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .lt-status-select--demo        { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
  .lt-status-select--proposal    { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
  .lt-status-select--negotiation { background: var(--warning-50); color: var(--warning-600); border-color: var(--warning-100); }
  .lt-status-select--won         { background: var(--success-50); color: var(--success-600); border-color: var(--success-100); }

  .wb-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--neutral-100);
    color: var(--text-muted);
  }
  .wb-badge--hot { background: var(--danger-50); color: var(--danger-600); }
  .wb-badge--danger { background: var(--danger-50); color: var(--danger-600); }
  .wb-badge--warn { background: var(--warning-50); color: var(--warning-600); }

  .wb-modal:not([open]) { display: none !important; }
  .wb-modal[open] { display: flex !important; flex-direction: column; }
  .wb-modal {
    border: none;
    border-radius: var(--radius-lg);
    padding: 0;
    max-width: 520px;
    width: calc(100% - 32px);
    max-height: calc(100vh - 48px);
    margin: auto;
    box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
    background: var(--surface);
    box-sizing: border-box;
  }
  .wb-modal::backdrop { background: rgba(15, 23, 42, 0.55); }
  .wb-modal__body {
    width: 100%;
    box-sizing: border-box;
    padding: 20px 22px;
    overflow-y: auto;
    flex: 1;
  }
  .wb-modal__head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .wb-modal__head h2 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
  .wb-modal__sub { font-size: 12px; color: var(--text-muted); margin: 0; }
  .wb-outcome-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
  .wb-outcome-option { display: block; }
  .wb-outcome-option input { position: absolute; opacity: 0; }
  .wb-outcome-option__surface {
    display: block;
    padding: 8px 10px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }
  .wb-outcome-option input:checked + .wb-outcome-option__surface {
    border-color: var(--primary-500);
    background: var(--primary-50);
    color: var(--primary-700);
  }
  .wb-field { margin-bottom: 12px; }
  .wb-field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .wb-field input, .wb-field select, .wb-field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
  }
  .wb-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wb-modal-error { background: var(--danger-50); color: var(--danger-700); border: 1px solid var(--danger-200); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; }
  .wb-modal__foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .wb-team-table { width: 100%; border-collapse: collapse; }
  .wb-team-table th, .wb-team-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
  .wb-team-table th { font-size: 10px; text-transform: uppercase; color: var(--text-muted); }
  .wb-team-table td.num, .wb-team-table th.num { text-align: right; }

  /* ── Mobile ─────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .wb-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .wb-stat { padding: 12px 44px 12px 12px; }
    .wb-stat__value { font-size: 19px; }
    .wb-stat__icon { width: 30px; height: 30px; right: 10px; }

    .wb-tabs { gap: 5px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
    .wb-tab { flex-shrink: 0; }

    /* Table rows become stacked cards — one <table> stays the source of
       truth for desktop and mobile; data-label (set in workbench.html)
       supplies the visible label at this width. */
    .wb-wrap { border: none; box-shadow: none; background: transparent; overflow: visible; }
    .wb-table { min-width: 0; width: 100%; }
    .wb-table thead { display: none; }
    .wb-table, .wb-table tbody, .wb-table tr, .wb-table td { display: block; width: 100%; }
    .wb-table tbody tr {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
    }
    .wb-table td { padding: 0; }
    .wb-table td.wb-th-check { display: none; }
    .wb-cell-lead { padding-bottom: 12px !important; margin-bottom: 10px; border-bottom: 1px solid var(--neutral-100); }
    .wb-table td.wb-cell-package, .wb-table td.wb-cell-value {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 0 !important; font-size: 13px; border-bottom: 1px solid var(--neutral-100);
    }
    .wb-cell-package::before, .wb-cell-value::before {
      content: attr(data-label); font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-muted); flex-shrink: 0;
    }
    .wb-cell-next { padding: 10px 0 !important; border-bottom: 1px solid var(--neutral-100); }
    .wb-cell-next::before {
      content: attr(data-label); display: block; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 5px;
    }
    .wb-cell-actions { padding-top: 12px !important; }
    .wb-actions { justify-content: flex-start; }
    .wb-act-btn { flex: 1 1 auto; justify-content: center; padding: 9px 10px; }

    .wb-outcome-grid { grid-template-columns: 1fr; }
    .wb-modal { width: calc(100% - 20px); max-height: calc(100vh - 24px); }
  }
</style>

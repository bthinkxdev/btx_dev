<div id="followup-calendar-grid" class="fu-cal"
     hx-get="{% url 'crm:followups_calendar_month' %}?y={{ year }}&m={{ month }}&date={{ selected_date|date:'Y-m-d' }}"
     hx-trigger="refreshCalendarGrid from:body"
     hx-target="this"
     hx-swap="outerHTML"
     {% if hx_oob %}hx-swap-oob="outerHTML"{% endif %}>
  <div class="fu-cal__head">
    <div>
      <h1>Follow-up Calendar</h1>
      <p>Click a date to view and manage follow-ups</p>
    </div>
  </div>

  <div class="fu-cal__nav">
    <a class="fu-cal__nav-btn"
       href="{% url 'crm:followups' %}?y={{ prev_y }}&m={{ prev_m }}"
       hx-get="{% url 'crm:followups' %}?y={{ prev_y }}&m={{ prev_m }}"
       hx-target="#crm-main-content" hx-select="#crm-main-content" hx-swap="outerHTML" hx-push-url="true"
       aria-label="Previous month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="fu-cal__month-label">{{ month_label }}</span>
    <a class="fu-cal__nav-btn"
       href="{% url 'crm:followups' %}?y={{ next_y }}&m={{ next_m }}"
       hx-get="{% url 'crm:followups' %}?y={{ next_y }}&m={{ next_m }}"
       hx-target="#crm-main-content" hx-select="#crm-main-content" hx-swap="outerHTML" hx-push-url="true"
       aria-label="Next month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a class="btn btn-outline btn-sm fu-cal__today-btn"
       href="{% url 'crm:followups' %}?y={{ today_y }}&m={{ today_m }}&date={{ today_iso }}"
       hx-get="{% url 'crm:followups' %}?y={{ today_y }}&m={{ today_m }}&date={{ today_iso }}"
       hx-target="#crm-main-content" hx-select="#crm-main-content" hx-swap="outerHTML" hx-push-url="true">Today</a>
  </div>

  <div class="fu-cal__grid">
    <div class="fu-cal__wd">Sun</div>
    <div class="fu-cal__wd">Mon</div>
    <div class="fu-cal__wd">Tue</div>
    <div class="fu-cal__wd">Wed</div>
    <div class="fu-cal__wd">Thu</div>
    <div class="fu-cal__wd">Fri</div>
    <div class="fu-cal__wd">Sat</div>
    {% for week in weeks %}
      {% for d in week %}
      <div class="fu-cal__day {% if not d.in_month %}fu-cal__day--out{% endif %} {% if d.is_selected %}fu-cal__day--selected{% endif %} {% if d.is_today %}fu-cal__day--today{% endif %}"
           data-date="{{ d.date|date:'Y-m-d' }}"
           hx-get="{% url 'crm:followups_day_panel' %}?date={{ d.date|date:'Y-m-d' }}"
           hx-target="#followup-day-panel"
           hx-swap="outerHTML"
           hx-push-url="false"
           onclick="document.querySelectorAll('.fu-cal__day--selected').forEach(function(e){e.classList.remove('fu-cal__day--selected')});this.classList.add('fu-cal__day--selected');">
        <span class="fu-cal__day-num">{{ d.day }}</span>
        {% if d.count %}
        <span class="fu-cal__day-badge fu-type-badge--{{ d.dominant_type }}">{{ d.count }}</span>
        {% endif %}
      </div>
      {% endfor %}
    {% endfor %}
  </div>
</div>

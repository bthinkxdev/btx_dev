{% if s == 'new' %}
<span class="crm-badge crm-badge--gray">New</span>
{% elif s == 'contacted' %}
<span class="crm-badge crm-badge--blue">Contacted</span>
{% elif s == 'qualified' %}
<span class="crm-badge crm-badge--teal">Qualified</span>
{% elif s == 'demo' %}
<span class="crm-badge crm-badge--cyan">Demo</span>
{% elif s == 'proposal' %}
<span class="crm-badge crm-badge--violet">Proposal</span>
{% elif s == 'negotiation' %}
<span class="crm-badge crm-badge--purple">Negotiation</span>
{% elif s == 'won' %}
<span class="crm-badge crm-badge--green">Won</span>
{% else %}
<span class="crm-badge crm-badge--gray">{{ s }}</span>
{% endif %}

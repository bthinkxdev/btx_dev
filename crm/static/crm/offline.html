<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>You're offline | BThinkX Business OS</title>
  <link rel="icon" href="/static/crm/images/icon-192.png">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Outfit, Arial, sans-serif;
      background: #f9fafb; color: #1d2939; padding: 24px; text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #101828; color: #f2f4f7; }
      .card { background: #1a222f; border-color: #1d2939; }
      .btn { background: #465fff; }
    }
    .card { max-width: 420px; width: 100%; background: #ffffff; border: 1px solid #e4e7ec; border-radius: 20px; padding: 40px 28px; box-shadow: 0 1px 3px rgba(16,24,40,0.1), 0 1px 2px rgba(16,24,40,0.06); }
    .icon { width: 56px; height: 56px; border-radius: 16px; background: #465fff1a; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #667085; margin: 0 0 24px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 8px; background: #465fff; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#465fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
    </div>
    <h1>You're offline</h1>
    <p>This page needs a connection to load. Anything you already had open keeps working — reconnect and this page will load automatically.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
